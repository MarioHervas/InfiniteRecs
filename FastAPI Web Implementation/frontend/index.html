<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InfiniteRecs</title>
  <meta name="description" content="Movie recommendations from your Letterboxd history." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <main class="app">

    <div class="hero">

      <div class="hero-content">

   
        <header class="masthead">
          <h1 class="logo">
            <span class="logo-1">Infinite</span><span class="logo-2">Recs</span>
          </h1>
          <p class="tagline">Movie recommendations based on your Letterboxd profile</p>
        </header>

        <section class="uploader">
          <form id="upload-form" class="upload-form">
            <label class="dropzone" id="dropzone">
              <input type="file" id="file-input" name="file" accept=".zip" hidden />
              <div class="dropzone-content">
                <div class="dropzone-icon">↑</div>
                <div class="dropzone-text">
                  <strong>Drag your Letterboxd .zip here</strong>
                  <span id="dropzone-hint">or click to select it</span>
                </div>
              </div>
            </label>

            <details class="advanced">
              <summary>Advanced options</summary>
              <div class="controls">
                <div class="control">
                  <label for="top-k">Number of recommendations</label>
                  <input type="number" id="top-k" class="top-k-input" min="1" value="10" />
                </div>
                <div class="control">
                  <label class="checkbox">
                    <input type="checkbox" id="use-finetuning" checked />
                    <span>Gradient descent refinement (fold-in)</span>
                  </label>
                </div>
                <div class="control">
                  <label class="checkbox">
                    <input type="checkbox" id="use-quadratic" checked />
                    <span>Quadratic rating weighting</span>
                  </label>
                </div>
                <div class="control">
                  <label class="checkbox">
                    <input type="checkbox" id="use-anti" checked />
                    <span>Anti-embedding of disliked movies</span>
                  </label>
                </div>
              </div>
            </details>

            <button type="submit" class="submit-btn" id="submit-btn" disabled>
              Recommend me
            </button>
          </form>

          <div id="status-bar" class="status-bar" hidden></div>
        </section>

      </div>

    </div>

    <section id="results" class="results" hidden>
      <div id="summary" class="summary"></div>

      <div class="results-block">
        <h2 class="block-title">Your detected favorites</h2>
        <div id="favorites-grid" class="poster-grid"></div>
      </div>

      <div class="results-block">
        <h2 class="block-title">Recommended movies</h2>
        <div id="recommendations-grid" class="poster-grid"></div>
        <div class="reveal-more-wrap">
          <button id="reveal-more" class="reveal-more" hidden>Show 5 more</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p id="health-info">Loading model metadata…</p>
      <p class="footer-company">Interlace TelEntertainment</p>
    </footer>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
